---
name: Release

on:
  push:
    tags:
      - "*"

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build-ebpf:
    name: Build eBPF
    runs-on: rust
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build eBPF programs
        run: |
          cd jail-ai-ebpf
          cargo +nightly build --release --target=bpfel-unknown-none -Z build-std=core

      - name: Upload eBPF artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: ebpf-programs
          path: target/bpfel-unknown-none/release/jail-ai-ebpf
          retention-days: 1

  build:
    name: Build x86_64
    needs: build-ebpf
    runs-on: rust
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal

      - name: Download eBPF artifact
        uses: https://data.forgejo.org/actions/download-artifact@v4
        with:
          name: ebpf-programs
          path: target/bpfel-unknown-none/release/

      - name: Build
        run: |
          cargo build --release --package jail-ai
          cargo build --release --package jail-ai-ebpf-loader
          strip target/release/jail-ai || true
          strip target/release/jail-ai-ebpf-loader || true

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/jail-ai dist/jail-ai-x86_64-linux
          cp target/release/jail-ai-ebpf-loader dist/jail-ai-ebpf-loader-x86_64-linux

      - name: Upload jail-ai
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: jail-ai-x86_64-linux
          path: dist/jail-ai-x86_64-linux

      - name: Upload loader
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: jail-ai-ebpf-loader-x86_64-linux
          path: dist/jail-ai-ebpf-loader-x86_64-linux

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: https://data.forgejo.org/actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "jail-ai-*"
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(curl -sf -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"generate_release_notes\":true}")

          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release ID: $RELEASE_ID"

          for f in artifacts/*; do
            echo "Uploading $(basename $f)..."
            curl -sf -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename $f)" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f"
          done
